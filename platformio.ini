[env:xiao_esp32s3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Build options
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_BT_NIMBLE_ENABLED=1

; Libraries
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    bblanchon/ArduinoJson@^7.0.4

; Board configuration
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

; USB CDC configuration
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

[env:esp32_wrover]
platform = espressif32@^6.3.0
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/tty.usbserial-112230

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DCONFIG_BT_NIMBLE_ENABLED=1

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    bblanchon/ArduinoJson@^7.0.4

board_build.partitions = partitions.csv
board_build.filesystem = spiffs

; Field mode: classic ESP32 WROVER with AP + web dashboard disabled.
; BLE runs continuous scan, so radio airtime is ~2x the default build.
; Review detections via serial monitor or post-walk SPIFFS export.
[env:esp32_wrover_field]
extends = env:esp32_wrover
build_flags =
    ${env:esp32_wrover.build_flags}
    -DFIELD_MODE

; Promiscuous log mode: prints every BLE ad seen with RSSI >= PROMISC_RSSI_MIN
; (default -70 dBm). Use to discover new Flock OUIs by walking up to a known
; camera and watching which unknown MAC's RSSI climbs as you approach.
[env:esp32_wrover_promisc]
extends = env:esp32_wrover
build_flags =
    ${env:esp32_wrover.build_flags}
    -DPROMISC_LOG
    -DPROMISC_RSSI_MIN=-100

; WiFi scan mode: disables BLE + dashboard AP, switches the radio to
; promiscuous monitor mode, hops channels 1-11, and alerts on any 802.11
; management frame whose SSID matches Flock Safety signatures.
; Signatures per GainSec research (2025): SSID "Flock-XXXXXX" (6 hex),
; "test_flck" (dev SSID from production firmware, CVE-2025-59409), or any
; substring "flock" as a catch-all.
[env:esp32_wrover_wifi_scan]
extends = env:esp32_wrover
build_flags =
    ${env:esp32_wrover.build_flags}
    -DWIFI_SCAN_MODE
    -DWIFI_SCAN_RSSI_MIN=-100

; Verbose WiFi scan: also logs every SSID seen, not just matches.
[env:esp32_wrover_wifi_scan_verbose]
extends = env:esp32_wrover_wifi_scan
build_flags =
    ${env:esp32_wrover_wifi_scan.build_flags}
    -DWIFI_SCAN_LOG_ALL
